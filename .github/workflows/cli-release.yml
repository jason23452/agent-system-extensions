name: CLI Release

on:
  push:
    tags:
      - 'cli/v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Create the prebuilt, self-contained npm tarball
        run: npm pack ./packages/cli --pack-destination "$RUNNER_TEMP"
      - name: Publish immutable CLI Release asset (no npm registry publish)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-cli-release.js "$GITHUB_REF_NAME" "$RUNNER_TEMP/agent-system-extension-distribution-cli-1.0.1.tgz"
